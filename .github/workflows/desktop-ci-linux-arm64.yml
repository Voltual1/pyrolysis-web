name: Desktop CI (Linux ARM64)

on:
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build (linux-arm64)
    runs-on: ubuntu-24.04-arm          # 原生 ARM64 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils libfuse2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: app_ver
        shell: bash
        run: |
          APP_VER=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Build Desktop Packages (Linux ARM64)
        run: ./gradlew :desktop:packageUberJarForCurrentOS :desktop:packageDeb :desktop:packageAppImage

      - name: Collect Platform Artifacts
        shell: bash
        run: |
          set -euo pipefail
          
          mkdir -p build-artifacts
          APP_VER="${{ steps.app_ver.outputs.APP_VERSION }}"
          PLAT="linux-arm64"
          
          echo "APP_VER=$APP_VER"
          
          JAR_FILE=$(find desktop/build/compose/jars -maxdepth 1 -type f -name "*.jar" | head -n 1 || true)
          [ -n "$JAR_FILE" ] && cp "\( JAR_FILE" "build-artifacts/Pyrolysis \){APP_VER}-desktop-uberjar.jar" && echo "Copied JAR: $JAR_FILE"
          
          DEB_FILE=$(find desktop/build/compose/binaries -type f -name "*.deb" | head -n 1 || true)
          [ -n "$DEB_FILE" ] && cp "\( DEB_FILE" "build-artifacts/Pyrolysis \){APP_VER}-desktop-${PLAT}.deb" && echo "Copied DEB: $DEB_FILE"
          
          APPIMAGE_FILE=$(find desktop/build/compose/binaries -type f -name "*.AppImage" | head -n 1 || true)
          [ -n "$APPIMAGE_FILE" ] && cp "\( APPIMAGE_FILE" "build-artifacts/Pyrolysis \){APP_VER}-desktop-${PLAT}.AppImage" && echo "Copied AppImage: $APPIMAGE_FILE"
          
          echo "=== Artifacts ==="
          ls -lh build-artifacts/
          
          if [ -z "$(ls -A build-artifacts)" ]; then
            echo "Error: No desktop artifacts were generated!"
            exit 1
          fi

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-linux-arm64
          path: build-artifacts/*
          retention-days: 7
