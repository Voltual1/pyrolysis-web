name: Desktop CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [published]
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保持完整历史记录以便获取版本信息

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          
      - name: Check Architecture
        run: uname -m
          
      - name: Set up Node.js (Pre-installed for KMP)
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'          

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4                         
      - name: Get version info
        id: version
        shell: bash
        run: |
          APP_VER=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          SHELL_VER=$(grep -E '^SHELL_VERSION_WASM=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_OUTPUT
          echo "SHELL_VERSION=${SHELL_VER}" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=auto-build-$(date +%Y%m%d_%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_OUTPUT

      - name: Build Desktop
        run: ./gradlew :desktop:assemble
