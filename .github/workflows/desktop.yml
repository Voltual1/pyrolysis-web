name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils libfuse2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: app_ver
        shell: bash
        run: |
          APP_VER=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Build Desktop Packages (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :desktop:packageUberJarForCurrentOS :desktop:packageDeb :desktop:packageAppImage

      - name: Build Desktop Packages (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :desktop:packageMsi

      - name: Build Desktop Packages (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew :desktop:packageDmg

      - name: Collect Platform Artifacts
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
          APP_VER="${{ steps.app_ver.outputs.APP_VERSION }}"
          PLAT="${{ matrix.platform }}"

          if [ "${{ runner.os }}" = "Linux" ]; then
            JAR_FILE=$(find desktop/build/compose/jars -maxdepth 1 -type f -name "*.jar" | head -n 1)
            [ -n "$JAR_FILE" ] && cp "$JAR_FILE" "$GITHUB_WORKSPACE/build-artifacts/Pyrolysis${APP_VER}-desktop-uberjar.jar"

            DEB_FILE=$(find desktop/build/compose/binaries -type f -name "*.deb" | head -n 1)
            [ -n "$DEB_FILE" ] && cp "$DEB_FILE" "$GITHUB_WORKSPACE/build-artifacts/Pyrolysis${APP_VER}-desktop-${PLAT}.deb"

            APPIMAGE_FILE=$(find desktop/build/compose/binaries -type f -name "*.AppImage" | head -n 1)
            [ -n "$APPIMAGE_FILE" ] && cp "$APPIMAGE_FILE" "$GITHUB_WORKSPACE/build-artifacts/Pyrolysis${APP_VER}-desktop-${PLAT}.AppImage"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            MSI_FILE=$(find desktop/build/compose/binaries -type f -name "*.msi" | head -n 1)
            [ -n "$MSI_FILE" ] && cp "$MSI_FILE" "$GITHUB_WORKSPACE/build-artifacts/Pyrolysis${APP_VER}-desktop-${PLAT}.msi"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            DMG_FILE=$(find desktop/build/compose/binaries -type f -name "*.dmg" | head -n 1)
            [ -n "$DMG_FILE" ] && cp "$DMG_FILE" "$GITHUB_WORKSPACE/build-artifacts/Pyrolysis${APP_VER}-desktop-${PLAT}.dmg"
          fi

          ls -lh "$GITHUB_WORKSPACE/build-artifacts"
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/build-artifacts")" ]; then
            echo "Error: No desktop artifacts were generated for ${PLAT}!"
            exit 1
          fi

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.platform }}
          path: build-artifacts/*
          retention-days: 3

  release:
    name: Create Draft Release
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        shell: bash
        run: |
          APP_VER=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          SHELL_VER=$(grep -E '^SHELL_VERSION_JVM=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_OUTPUT
          echo "SHELL_VERSION=${SHELL_VER}" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=auto-build-$(date +%Y%m%d_%H%M%S)-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_OUTPUT

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: List Release Artifacts
        run: ls -lh release-artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.BUILD_VERSION }}
          name: "Auto Build ${{ steps.version.outputs.BUILD_VERSION }}"
          body: |
            ### 构建信息
            - 应用版本: `${{ steps.version.outputs.APP_VERSION }} (desktop ${{ steps.version.outputs.SHELL_VERSION }})`
            - 覆盖平台: `Linux (x64 .deb / .AppImage)` · `Windows (x64 .msi)` · `macOS (ARM64 .dmg)` · `跨平台 UberJar (.jar)`
            - 提交: `${{ github.sha }}`
            - 构建时间: `${{ steps.version.outputs.TIMESTAMP }}`

            **注意**: 这是一个自动生成的多平台 Desktop 分发包草稿。
          draft: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}