name: Generate Desktop Icons

on:
  push:
    paths:
      - 'fire.svg'
      - '.github/workflows/generate-icons.yml'
  workflow_dispatch:          # 支持手动触发

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate icons
        run: |
          mkdir -p icons
          
          # 1. SVG → 1024×1024 PNG（透明背景，高质量）
          convert -background none -density 300 -resize 1024x1024 \
            fire.svg icons/icon_1024.png
          
          # 2. 生成常用尺寸 PNG
          for size in 16 32 48 64 128 256 512; do
            convert icons/icon_1024.png -resize \( {size}x \){size} \
              icons/icon_${size}.png
          done
          
          # 3. 用 png2icons 生成 .ico 和 .icns
          npx --yes png2icons icons/icon_1024.png icons/icon -allp -bc
          
          # 4. 复制一份主 Linux 图标
          cp icons/icon_512.png icons/icon.png
          
          echo "✅ Generated files:"
          ls -lh icons/

      - name: Upload icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-icons
          path: icons/
          retention-days: 30
          if-no-files-found: error
