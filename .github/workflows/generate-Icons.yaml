name: Generate Desktop Icons

on:
  push:
    paths:
      - 'fire.svg'
      - '.github/workflows/generate-icons.yml'
  workflow_dispatch:

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Generate icons
        run: |
          mkdir -p icons
          
          rsvg-convert -w 1024 -h 1024 --background-color none fire.svg -o icons/icon_1024.png
          
          convert icons/icon_1024.png -resize 16x16   icons/icon_16.png
          convert icons/icon_1024.png -resize 32x32   icons/icon_32.png
          convert icons/icon_1024.png -resize 48x48   icons/icon_48.png
          convert icons/icon_1024.png -resize 64x64   icons/icon_64.png
          convert icons/icon_1024.png -resize 128x128 icons/icon_128.png
          convert icons/icon_1024.png -resize 256x256 icons/icon_256.png
          convert icons/icon_1024.png -resize 512x512 icons/icon_512.png
          
          npx --yes png2icons icons/icon_1024.png icons/icon -allp -bc
          
          cp icons/icon_512.png icons/icon.png
          
          echo "✅ Generated files:"
          ls -lh icons/

      - name: Upload icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-icons
          path: icons/
          retention-days: 30
          if-no-files-found: error
